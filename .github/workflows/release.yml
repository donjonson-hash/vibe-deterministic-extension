name: Deterministic CI & Build

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  verify-and-build:
    name: Typecheck & Build Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies (Deterministic lockfile)
        run: npm ci

      - name: Run TypeScript Typecheck
        run: npm run typecheck

      - name: Build Extension (npm run build)
        run: npm run build

      - name: Verify dist/ output exists
        run: |
          if [ ! -f "dist/extension.js" ]; then
            echo "Error: dist/extension.js was not generated!"
            exit 1
          fi

      - name: Package Extension Archive (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        run: zip -r vibe-deterministic-extension.zip package.json dist/ assets/ README.md

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-build-dist
          path: dist/
          retention-days: 7
