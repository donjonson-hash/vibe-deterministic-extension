name: Chrome offline pilot
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  installed-extension:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm test && npm run test:evidence
      - run: npx playwright install --with-deps chromium
      - run: npm run package:chrome
      - run: npm run test:chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chrome-offline-pilot
          path: artifacts/
